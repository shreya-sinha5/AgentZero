global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "monitored-ecommerce"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["monitored-app:8001"]

  - job_name: "agentzero-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
